<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#f2ede4" />
  <title>今天吃什麼？</title>

  <!-- 加到手機主畫面用的圖示，之後放進 assets/icons -->
  <link rel="icon" href="assets/icons/favicon.png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

  <!-- 所有頁面內容由 router.js 動態換掉這個容器 -->
  <main id="app" class="app-main">
    <div class="loading-screen">
      <p>載入中…</p>
    </div>
  </main>

  <!-- 底部導覽列：登入前隱藏，登入後由 auth.js 顯示 -->
  <nav id="tabbar" class="tabbar hidden">
    <a href="#/home" class="tab" data-path="/home">
      <svg class="tab-icon icon" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
      首頁
    </a>
    <a href="#/recipes" class="tab" data-path="/recipes">
      <svg class="tab-icon icon" viewBox="0 0 24 24"><path d="M5 4a2 2 0 0 1 2-2h11v18H7a2 2 0 0 0-2 2V4Z"/><path d="M8 7h6M8 10h6"/></svg>
      食譜
    </a>
    <a href="#/diary" class="tab" data-path="/diary">
      <svg class="tab-icon icon" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      日記
    </a>
    <a href="#/expenses" class="tab" data-path="/expenses">
      <svg class="tab-icon icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v2M12 15v2M9.5 15c0 1.1 1.1 2 2.5 2s2.5-.8 2.5-1.8c0-2.6-5-1.4-5-4C9.5 10.2 10.6 9.5 12 9.5s2.5.7 2.5 1.7"/></svg>
      花費
    </a>
    <a href="#/settings" class="tab" data-path="/settings">
      <svg class="tab-icon icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1c.6.5 1.3.9 2 1.2L10 21h4l.5-2.6c.7-.3 1.4-.7 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2Z"/></svg>
      設定
    </a>
  </nav>

  <!-- 全站共用：確認刪除等提示框，由 utils.js 控制顯示 -->
  <div id="confirm-dialog" class="dialog-overlay hidden">
    <div class="dialog-box">
      <button id="confirm-dialog-close" class="dialog-close" aria-label="關閉">
        <svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <p id="confirm-dialog-message"></p>
      <div class="dialog-actions">
        <button id="confirm-dialog-cancel" class="btn btn-ghost">取消</button>
        <button id="confirm-dialog-ok" class="btn btn-danger">確定</button>
      </div>
    </div>
  </div>

  <!-- 全站共用：輕量提示訊息（toast） -->
  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
